name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # macOS only: the timer relies on launchd, ps, lsof and simctl, and the installer refuses
    # to run anywhere else.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Shell syntax
        run: |
          bash -n install.sh
          sh -n idle-reaper-hook.sh
      - name: Unit, hook and installer tests (nothing real is touched)
        run: python3 -m unittest discover -s tests -v
      - name: Installer wires and unwires a throwaway home
        run: |
          T="$RUNNER_TEMP/home"
          mkdir -p "$T"
          HOME="$T" bash install.sh --bin "$T/bin" --no-launchd
          HOME="$T" bash install.sh --bin "$T/bin" --no-launchd | grep -q "settings already up to date"
          plutil -lint "$T/Library/LaunchAgents/local.idle-reaper.plist"
          python3 -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/home/.claude/settings.json')); assert set(d['hooks'])=={'PreToolUse','PostToolUse','UserPromptSubmit'}, d"
          HOME="$T" bash install.sh --bin "$T/bin" --no-launchd --uninstall --purge
          python3 -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/home/.claude/settings.json')); assert 'hooks' not in d, d"
          test ! -e "$T/Library/LaunchAgents/local.idle-reaper.plist"
          test ! -e "$T/bin/running"
